# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.4.0"

[locales."en-us"]
whats-new = """
Zuruf now runs on iPad, with your conversations in a sidebar beside the one that is open. An iPad joins with an invite code like any other device.

When you pick a complication, the Talk complication that follows whoever you last talked to now says "Talk to last person", so it no longer looks like the Talk to complication for that person.
"""
