# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.5.1"

[locales."en-us"]
whats-new = """
Reactions on iPhone are larger and drawn without a background, at the size of the Play button. Tapping the notification for a reaction to your message opens that conversation on iPhone, or the inbox on the watch.
"""
