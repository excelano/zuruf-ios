# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.4.2"

[locales."en-us"]
whats-new = """
Fixes messages getting stuck on the watch. If one recording went missing before it was sent, every message recorded after it waited on the watch instead of going out. The missing one is now skipped and the rest send.
"""
