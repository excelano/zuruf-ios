# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.3.3"

[locales."en-us"]
whats-new = """
Transcripts spell names right more often: the admin page of your server can list names and words for transcribing to expect, such as a name that sounds like a common word.
On the watch, the Transcribe button lines up with Play and Reply.
"""
