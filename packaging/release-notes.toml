# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.4.3"

[locales."en-us"]
whats-new = """
Messages sent from the watch away from your iPhone now go out right away. Before, a message could stay on the watch, waiting to send, until you opened Zuruf again or came back to Wi-Fi, because the upload stopped when you lowered your wrist. A message that waits for a connection now goes out as soon as the watch wakes, and a message sent again after a lost connection is never delivered twice.
"""
