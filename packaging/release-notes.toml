# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.5.3"

[locales."en-us"]
whats-new = """
You can play back your own messages. On iPhone, a message you sent has a Play button in its bubble. On the watch, choosing a message in the Sent list opens it with who it went to, who has played it, and a Play button.

The microphone on the round and corner complications now fills its space.

The aerial tramway is a reaction, in place of the face with tears of joy.
"""
