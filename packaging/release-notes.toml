# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.3.2"

[locales."en-us"]
whats-new = """
A notification your iPhone passes to your watch has its Reply button again, and Reply opens the talk screen on the watch.
The Talk to complication no longer crashes over and over in the background, which could drain the watch's battery.
On iPhone, swipe a clip to mark it as read or delete it, as on the watch.
"""
